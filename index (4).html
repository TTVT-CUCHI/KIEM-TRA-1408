<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Tự Kiểm Tra Mạng Lưới</title>
<style>
:root{--ink:#0B2540;--teal:#0F7173;--teal-dark:#0A5456;--amber:#C97A25;--green:#2F7D5C;--bg:#F4F6F5;--card:#fff;--line:#DDE3E1;--text:#12242E;--muted:#5B6B71;--danger:#B4432E}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:var(--bg);font-family:Arial,sans-serif;color:var(--text);-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative}
header{background:var(--ink);color:#fff;padding:20px 20px 16px;position:sticky;top:0;z-index:20}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.title-row h1{font-size:19px;margin:0}.sub{font-size:12.5px;color:#9FB6BC;margin-top:2px}
.id-chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:5px 10px;font-size:13px;color:#CFE8E6}
.progress-track{display:flex;gap:5px;margin-top:14px}.progress-seg{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.16)}.progress-seg.done{background:var(--teal)}.progress-seg.active{background:linear-gradient(90deg,var(--teal) 50%,rgba(255,255,255,.16) 50%)}
.step-label{font-size:12px;color:#9FB6BC;margin-top:8px}.step-label b{color:#fff}
main{flex:1;padding:20px 20px 110px}.step-heading{margin-bottom:16px}.step-heading .num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;background:var(--teal);color:#fff;font-size:13px;font-weight:700;margin-right:8px}.step-heading h2{font-size:18px}.step-heading p{font-size:13.5px;color:var(--muted);margin:6px 0 0;line-height:1.5}
.field{margin-bottom:18px}.field label{display:block;font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:6px}.hint{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.4}
input[type=text],input[type=date],textarea,select{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:12px 13px;font-size:16px;color:var(--text);outline:none}input:focus,textarea:focus,select:focus{border-color:var(--teal)}textarea{min-height:84px;resize:vertical;line-height:1.5}
.group-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.group-btn{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:14px 12px;text-align:left;cursor:pointer}.group-btn .g{font-weight:700;font-size:20px;color:var(--ink)}.group-btn .t{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}.group-btn.sel{border-color:var(--teal);background:#EAF5F3}
.stt-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:14px}.stt-btn{aspect-ratio:1;border:1.5px solid var(--line);background:var(--card);border-radius:9px;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer}.stt-btn.sel{background:var(--teal);border-color:var(--teal);color:#fff}.stt-btn.used{background:#EFF1F0;color:#9AA6A2}
.id-preview{margin-top:16px;padding:12px 14px;border-radius:10px;background:#EAF5F3;border:1px solid #BFE0DB;color:var(--teal-dark);display:flex;justify-content:space-between}
.gps-box{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;background:var(--card)}.gps-box.got{border-style:solid;border-color:var(--green);background:#EEF6F1}.gps-btn{background:var(--teal);color:#fff;border:0;border-radius:10px;padding:11px 20px;font-size:14.5px;font-weight:700}.gps-coord{margin-top:10px;font-size:13.5px;color:var(--green)}.gps-status{font-size:12.5px;color:var(--muted);margin-top:8px}.map-link{font-size:12.5px;color:var(--teal-dark);text-decoration:underline;margin-top:6px;display:inline-block}
.pill-row{display:flex;gap:8px;flex-wrap:wrap}.pill{flex:1;min-width:100px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:11px 8px;text-align:center;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--muted)}.pill[data-v="Đạt"].sel{background:#EAF6EF;border-color:var(--green);color:var(--green)}.pill[data-v="Không đạt"].sel{background:#FBEBE7;border-color:var(--danger);color:var(--danger)}.pill[data-v="Cần theo dõi"].sel{background:#FCF2E3;border-color:var(--amber);color:var(--amber)}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.photo-slot{aspect-ratio:3/4;border-radius:12px;border:1.5px dashed var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:8px}.photo-slot.filled{border-style:solid;border-color:var(--teal);padding:0}.photo-slot img{width:100%;height:100%;object-fit:cover}.photo-slot .lab{font-size:12px;color:var(--ink);font-weight:700;margin-bottom:8px}.photo-actions{width:100%;display:flex;flex-direction:column;gap:7px}.photo-action{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 5px;background:#F7FAF9;color:var(--ink);font-size:11px;font-weight:700;cursor:pointer}.photo-action.camera{background:#EAF5F3;border-color:#BFE0DB;color:var(--teal-dark)}.photo-slot .rm{position:absolute;top:6px;right:6px;background:rgba(11,37,64,.75);color:#fff;width:26px;height:26px;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px}
.summary-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}.summary-card h3{font-size:13px;color:var(--muted);margin:0 0 10px}.srow{display:flex;justify-content:space-between;gap:14px;padding:6px 0;font-size:14px;border-top:1px solid #EEF1F0}.srow:first-of-type{border-top:0}.srow .k{color:var(--muted)}.srow .v{text-align:right;font-weight:600}
footer{position:sticky;bottom:0;background:var(--bg);padding:14px 20px 20px;display:flex;gap:10px;border-top:1px solid var(--line)}.btn{flex:1;border:0;border-radius:11px;padding:14px;font-size:15px;font-weight:700;cursor:pointer}.btn-back{background:var(--card);color:var(--ink);border:1.5px solid var(--line);flex:0 0 92px}.btn-next{background:var(--teal);color:#fff}.btn-next:disabled{background:#B9CBC9}.btn-submit{background:var(--ink);color:#fff}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;max-width:400px;text-align:center;z-index:50}.done-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 30px;text-align:center}.done-badge{width:64px;height:64px;border-radius:50%;background:#EAF6EF;color:var(--green);display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:20px}
@media(max-width:360px){.stt-grid{grid-template-columns:repeat(5,1fr)}}
</style>
</head>
<body>
<div id="app">
<header>
<div class="title-row"><div><h1>Tự Kiểm Tra Mạng Lưới</h1><div class="sub">Phụ lục 1 — Tháng 09/2026</div></div><div class="id-chip" id="headerIdChip">Chưa chọn mục</div></div>
<div class="progress-track" id="progressTrack"></div>
<div class="step-label">Bước <b id="stepNum">1</b>/7 — <span id="stepName">Chọn hạng mục kiểm tra</span></div>
</header>
<main id="main"></main>
<footer id="footer"><button class="btn btn-back" id="btnBack">Quay lại</button><button class="btn btn-next" id="btnNext">Tiếp theo</button></footer>
</div>
<script>
const APPS_SCRIPT_URL="https://script.google.com/macros/s/AKfycbzh0MYmVf1eKGfD4fwa9QpZr9RPfrxxlaaNNYaQJVBLhlE5b34iC5ucrilTbZEhj6pknA/exec";
const GROUPS=[
{code:"I",name:"Chất lượng dịch vụ & TNKH BRCĐ",count:12},
{code:"II",name:"Chất lượng CSKH GHTT",count:12},
{code:"III",name:"BTBD tập điểm",count:12},
{code:"IV",name:"Nghiệm thu hình ảnh",count:10}
];
const OPTIONS={
nguoiKT:["Đỗ Thanh Hiệp","Nguyễn Hữu Tòng","Nguyễn Anh Tuấn","Nguyễn Văn Toàn","Ngô Văn Thành","Lê Châu Duy Triệu","Nguyễn Hoài Trung","Lê Minh Long"],
chucVu:["HTKT","PGD","Tổ trưởng"],
donVi:["BGD","KV Tổ KTĐB Bình Mỹ 1","KV Tổ KTĐB Bình Mỹ 2","KV Tổ KTĐB Củ Chi 1","KV Tổ KTĐB Củ Chi 2","KV Tổ KTĐB Phú Hòa Đông 1","KV Tổ KTĐB Phú Hòa Đông 2"],
noiDung:["Trải nghiệm KH","GHTT","BTBD","NTHA"]
};
const PERSON_ROLE_MAP={"Đỗ Thanh Hiệp":"HTKT","Nguyễn Hữu Tòng":"PGD","Nguyễn Anh Tuấn":"Tổ trưởng","Nguyễn Văn Toàn":"Tổ trưởng","Ngô Văn Thành":"Tổ trưởng","Lê Châu Duy Triệu":"Tổ trưởng","Nguyễn Hoài Trung":"Tổ trưởng","Lê Minh Long":"Tổ trưởng"};
const STEPS=["Hạng mục","Người kiểm tra","Nội dung kiểm tra","Vị trí & kết quả","Hình ảnh hiện trường","Lỗi & khắc phục","Xác nhận & gửi"];
function todayStr(){const d=new Date();return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear()}
function toDateInput(v){if(!v)return "";const p=v.split("/");return p.length===3?`${p[2]}-${p[1]}-${p[0]}`:v}
function fromDateInput(v){if(!v)return "";const p=v.split("-");return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:v}
let state={group:null,stt:null,nguoiKT:"",chucVu:"",donVi:"",ngayKT:todayStr(),noiDung:"",chiTiet:"",maThueBao:"",tenKH:"",toaDo:"",ketQua:"",hinhAnhQuyDinh:"",loiTonTai:"",phanLoaiLoi:"",nguyenNhan:"",danhGia:"",deXuat:"",boPhan:"",thoiGianKhacPhuc:"",photos:[null,null,null],_other:{nguoiKT:false,chucVu:false,donVi:false,noiDung:false}};
let step=0,usedIdsCache=null,isFetchingUsed=false;
function el(html){const t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstChild}
function currentId(){return state.group&&state.stt?state.group+"-"+String(state.stt).padStart(2,"0"):null}
function mountSelectField(container,key,label,options,placeholder,onSelect){
 const isOther=state._other[key],val=state[key];
 const box=el(`<div class="field"><label>${label}</label><select><option value="">— Chọn ${label.toLowerCase()} —</option>${options.map(o=>`<option value="${o}">${o}</option>`).join("")}<option value="__other__">Khác — tự nhập</option></select></div>`);
 const s=box.querySelector("select");s.value=isOther?"__other__":options.includes(val)?val:"";
 s.onchange=()=>{if(s.value==="__other__"){state._other[key]=true;state[key]=""}else{state._other[key]=false;state[key]=s.value}if(onSelect)onSelect(s.value);renderStep()};
 if(isOther){const txt=el(`<input type="text" placeholder="${placeholder}" value="${val}" style="margin-top:8px">`);txt.oninput=e=>{state[key]=e.target.value;validateStep()};box.appendChild(txt)}
 container.appendChild(box)
}
function fetchUsedIds(cb){if(isFetchingUsed)return;isFetchingUsed=true;fetch(APPS_SCRIPT_URL+"?action=usedIds").then(r=>r.json()).then(d=>{usedIdsCache=d.usedIds||[];isFetchingUsed=false;cb&&cb()}).catch(()=>{isFetchingUsed=false;usedIdsCache=[];cb&&cb()})}
function renderProgress(){const t=document.getElementById("progressTrack");t.innerHTML="";for(let i=0;i<7;i++){const s=document.createElement("div");s.className="progress-seg"+(i<step?" done":"")+(i===step?" active":"");t.appendChild(s)}document.getElementById("stepNum").textContent=step+1;document.getElementById("stepName").textContent=STEPS[step];document.getElementById("headerIdChip").textContent=currentId()||"Chưa chọn mục"}
function renderStep(){const m=document.getElementById("main");m.innerHTML="";renderProgress();[stepGroup,stepPerson,stepContent,stepLocation,stepPhotos,stepIssue,stepConfirm][step]().then?null:m.appendChild([stepGroup,stepPerson,stepContent,stepLocation,stepPhotos,stepIssue,stepConfirm][step]());document.getElementById("btnBack").style.visibility=step===0?"hidden":"visible";const b=document.getElementById("btnNext");b.textContent=step===6?"Gửi dữ liệu":"Tiếp theo";b.className=step===6?"btn btn-submit":"btn btn-next";validateStep()}
function stepGroup(){const w=el(`<div><div class="step-heading"><span class="num">1</span><h2 style="display:inline">Chọn hạng mục kiểm tra</h2><p>Chọn nhóm và số thứ tự. Mục có dấu ✓ là đã có người nhập.</p></div><div class="group-grid" id="gg"></div><div id="sa"></div><div id="ip"></div></div>`);if(usedIdsCache===null)fetchUsedIds(()=>{if(step===0)renderStep()});const gg=w.querySelector("#gg");GROUPS.forEach(g=>{const b=el(`<div class="group-btn ${state.group===g.code?"sel":""}"><div class="g">${g.code}</div><div class="t">${g.name}</div></div>`);b.onclick=()=>{state.group=g.code;state.stt=null;renderStep()};gg.appendChild(b)});if(state.group){const g=GROUPS.find(x=>x.code===state.group),grid=el(`<div class="stt-grid"></div>`);for(let n=1;n<=g.count;n++){const id=g.code+"-"+String(n).padStart(2,"0"),used=(usedIdsCache||[]).includes(id),b=el(`<div class="stt-btn ${state.stt===n?"sel":""} ${used?"used":""}">${used?"✓":n}</div>`);b.onclick=()=>used?showToast("Mục "+id+" đã có người nhập"):((state.stt=n),renderStep());grid.appendChild(b)}w.querySelector("#sa").appendChild(el(`<div class="field" style="margin-top:16px;margin-bottom:0"><label>Số thứ tự trong nhóm ${g.code}</label></div>`));w.querySelector("#sa").appendChild(grid)}if(currentId())w.querySelector("#ip").appendChild(el(`<div class="id-preview"><span>Mã hạng mục</span><b>${currentId()}</b></div>`));return w}
function stepPerson(){
 const w=el(`<div><div class="step-heading"><span class="num">2</span><h2 style="display:inline">Thông tin người kiểm tra</h2><p>Chọn người thực hiện và ngày kiểm tra. Ngày mặc định là hôm nay nhưng có thể thay đổi.</p></div><div id="n"></div><div id="c"></div><div id="d"></div><div class="field"><label>Ngày kiểm tra</label><input type="date" id="ngay" value="${toDateInput(state.ngayKT)}"><div class="hint">Có thể chọn lại ngày kiểm tra theo thực tế.</div></div></div>`);
 mountSelectField(w.querySelector("#n"),"nguoiKT","Người kiểm tra",OPTIONS.nguoiKT,"Nhập tên người kiểm tra",v=>{if(PERSON_ROLE_MAP[v]){state.chucVu=PERSON_ROLE_MAP[v];state._other.chucVu=false}});
 mountSelectField(w.querySelector("#c"),"chucVu","Chức vụ",OPTIONS.chucVu,"Nhập chức vụ");
 mountSelectField(w.querySelector("#d"),"donVi","Đơn vị",OPTIONS.donVi,"Nhập tên đơn vị");
 w.querySelector("#ngay").onchange=e=>{state.ngayKT=fromDateInput(e.target.value);validateStep()};
 return w
}
function stepContent(){const w=el(`<div><div class="step-heading"><span class="num">3</span><h2 style="display:inline">Nội dung kiểm tra</h2><p>Mô tả đối tượng và nội dung đang kiểm tra.</p></div><div id="nd"></div><div class="field"><label>Chi tiết nội dung</label><textarea id="ct">${state.chiTiet}</textarea></div><div class="field"><label>Mã thuê bao / Mã đặt trạm / Mã tủ cáp, tập điểm</label><input type="text" id="ma" value="${state.maThueBao}"></div><div class="field"><label>Tên khách hàng / Địa chỉ đài trạm / Tủ cáp, tập điểm</label><input type="text" id="ten" value="${state.tenKH}"></div></div>`);mountSelectField(w.querySelector("#nd"),"noiDung","Nội dung kiểm tra",OPTIONS.noiDung,"Nhập nội dung kiểm tra");[["ct","chiTiet"],["ma","maThueBao"],["ten","tenKH"]].forEach(([id,k])=>w.querySelector("#"+id).oninput=e=>{state[k]=e.target.value;validateStep()});return w}
function stepLocation(){const w=el(`<div><div class="step-heading"><span class="num">4</span><h2 style="display:inline">Vị trí & kết quả</h2><p>Lấy tọa độ GPS tại hiện trường và ghi nhận kết quả.</p></div><div class="field"><label>Tọa độ hiện trường</label><div class="gps-box ${state.toaDo?"got":""}"><button type="button" class="gps-btn" id="gps">📍 Lấy vị trí hiện tại</button><div class="gps-status" id="gs">${state.toaDo?"Đã định vị thành công":"Bấm để định vị bằng GPS điện thoại"}</div><div id="gr"></div></div></div><div class="field"><label>Kết quả kiểm tra</label><div class="pill-row">${["Đạt","Không đạt","Cần theo dõi"].map(v=>`<div class="pill ${state.ketQua===v?"sel":""}" data-v="${v}">${v}</div>`).join("")}</div></div><div class="field"><label>Hình ảnh kiểm tra (theo quy định)</label><input type="text" id="ha" value="${state.hinhAnhQuyDinh}"></div></div>`);if(state.toaDo){const [a,b]=state.toaDo.split(",");w.querySelector("#gr").innerHTML=`<div class="gps-coord">✓ ${state.toaDo}</div><a class="map-link" href="https://maps.google.com/?q=${a},${b}" target="_blank">Xem trên bản đồ</a>`}w.querySelector("#gps").onclick=()=>{const s=w.querySelector("#gs");s.textContent="Đang định vị...";if(!navigator.geolocation){s.textContent="Trình duyệt không hỗ trợ GPS";return}navigator.geolocation.getCurrentPosition(p=>{state.toaDo=p.coords.latitude.toFixed(6)+","+p.coords.longitude.toFixed(6);renderStep()},()=>s.textContent="Không lấy được vị trí — kiểm tra quyền định vị",{enableHighAccuracy:true,timeout:12000})};w.querySelectorAll(".pill").forEach(p=>p.onclick=()=>{state.ketQua=p.dataset.v;renderStep()});w.querySelector("#ha").oninput=e=>state.hinhAnhQuyDinh=e.target.value;return w}
function stepPhotos(){
 const w=el(`<div><div class="step-heading"><span class="num">5</span><h2 style="display:inline">Hình ảnh hiện trường</h2><p>Với mỗi ảnh, chọn chụp trực tiếp hoặc tải ảnh có sẵn từ thiết bị — tối đa 3 ảnh.</p></div><div class="photo-grid" id="pg"></div></div>`),g=w.querySelector("#pg");
 [0,1,2].forEach(i=>{
  const s=el(`<div class="photo-slot ${state.photos[i]?"filled":""}">${state.photos[i]?`<img src="${state.photos[i]}" alt="Ảnh ${i+1}"><button type="button" class="rm" aria-label="Xóa ảnh ${i+1}">✕</button>`:`<div class="lab">Ảnh ${i+1}</div><div class="photo-actions"><button type="button" class="photo-action camera">📷 Chụp trực tiếp</button><button type="button" class="photo-action upload">🖼️ Chọn từ thiết bị</button></div>`}<input class="camera-input" type="file" accept="image/*" capture="environment" style="display:none"><input class="upload-input" type="file" accept="image/*" style="display:none"></div>`);
  const cameraInput=s.querySelector(".camera-input"),uploadInput=s.querySelector(".upload-input");
  const receivePhoto=e=>{const f=e.target.files&&e.target.files[0];if(f)compressImage(f,d=>{state.photos[i]=d;renderStep()})};
  const cameraBtn=s.querySelector(".camera"),uploadBtn=s.querySelector(".upload"),removeBtn=s.querySelector(".rm");
  if(cameraBtn)cameraBtn.onclick=()=>cameraInput.click();
  if(uploadBtn)uploadBtn.onclick=()=>uploadInput.click();
  if(removeBtn)removeBtn.onclick=()=>{state.photos[i]=null;renderStep()};
  cameraInput.onchange=receivePhoto;
  uploadInput.onchange=receivePhoto;
  g.appendChild(s)
 });
 return w
}
function compressImage(file,cb){const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,1280/im.width),c=document.createElement("canvas");c.width=im.width*sc;c.height=im.height*sc;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.72))};im.src=e.target.result};r.readAsDataURL(file)}
function stepIssue(){const w=el(`<div><div class="step-heading"><span class="num">6</span><h2 style="display:inline">Lỗi & đề xuất khắc phục</h2><p>${state.ketQua==="Không đạt"?"Ghi nhận lỗi tồn tại và hướng xử lý.":"Không bắt buộc nếu kết quả kiểm tra đạt yêu cầu."}</p></div><div class="field"><label>Lỗi tồn tại</label><textarea id="loi">${state.loiTonTai}</textarea></div><div class="field"><label>Phân loại lỗi</label><select id="pl"><option value="">— Chọn phân loại —</option>${["Kỹ thuật","Dịch vụ khách hàng","An toàn lao động","Khác"].map(v=>`<option ${state.phanLoaiLoi===v?"selected":""}>${v}</option>`).join("")}</select></div><div class="field"><label>Nguyên nhân tồn tại (nếu có)</label><textarea id="nn">${state.nguyenNhan}</textarea></div><div class="field"><label>Đánh giá</label><input type="text" id="dg" value="${state.danhGia}"></div><div class="field"><label>Đề xuất khắc phục</label><textarea id="dx">${state.deXuat}</textarea></div><div class="field"><label>Bộ phận / cá nhân chịu trách nhiệm khắc phục</label><input type="text" id="bp" value="${state.boPhan}"></div><div class="field"><label>Thời gian yêu cầu khắc phục</label><input type="date" id="tg" value="${state.thoiGianKhacPhuc}"></div></div>`);[["loi","loiTonTai"],["nn","nguyenNhan"],["dg","danhGia"],["dx","deXuat"],["bp","boPhan"]].forEach(([id,k])=>w.querySelector("#"+id).oninput=e=>state[k]=e.target.value);w.querySelector("#pl").onchange=e=>state.phanLoaiLoi=e.target.value;w.querySelector("#tg").onchange=e=>state.thoiGianKhacPhuc=e.target.value;return w}
function stepConfirm(){return el(`<div><div class="step-heading"><span class="num">7</span><h2 style="display:inline">Xác nhận & gửi</h2><p>Kiểm tra lại thông tin trước khi gửi.</p></div><div class="summary-card"><h3>Hạng mục</h3><div class="srow"><span class="k">Mã</span><span class="v">${currentId()||"—"}</span></div><div class="srow"><span class="k">Người kiểm tra</span><span class="v">${state.nguoiKT||"—"}</span></div><div class="srow"><span class="k">Đơn vị</span><span class="v">${state.donVi||"—"}</span></div><div class="srow"><span class="k">Ngày</span><span class="v">${state.ngayKT||"—"}</span></div></div><div class="summary-card"><h3>Nội dung & kết quả</h3><div class="srow"><span class="k">Nội dung</span><span class="v">${state.noiDung||"—"}</span></div><div class="srow"><span class="k">Kết quả</span><span class="v">${state.ketQua||"—"}</span></div><div class="srow"><span class="k">Tọa độ</span><span class="v">${state.toaDo||"—"}</span></div><div class="srow"><span class="k">Ảnh đã chụp</span><span class="v">${state.photos.filter(Boolean).length}/3</span></div></div></div>`)}
function validateStep(){const b=document.getElementById("btnNext");let ok=true;if(step===0)ok=!!(state.group&&state.stt);if(step===1)ok=!!(state.nguoiKT.trim()&&state.donVi.trim()&&state.ngayKT);if(step===2)ok=!!state.noiDung.trim();if(step===3)ok=!!(state.toaDo&&state.ketQua);b.disabled=!ok}
document.getElementById("btnBack").onclick=()=>{if(step>0){step--;renderStep()}};
document.getElementById("btnNext").onclick=()=>{if(step<6){step++;renderStep()}else submitData()};
function showToast(msg){let t=document.querySelector(".toast");if(t)t.remove();t=el(`<div class="toast">${msg}</div>`);document.getElementById("app").appendChild(t);setTimeout(()=>t.remove(),2500);return t}
function submitData(){const b=document.getElementById("btnNext");b.disabled=true;b.textContent="Đang gửi...";const payload={"ID":currentId(),"Nhóm kiểm tra":state.group,"STT trong nhóm":state.stt,"Người kiểm tra":state.nguoiKT,"Chức vụ":state.chucVu,"Đơn vị":state.donVi,"Ngày kiểm tra":state.ngayKT,"Nội dung kiểm tra":state.noiDung,"Chi tiết nội dung":state.chiTiet,"Mã thuê bao/Mã đặt trạm/Mã Tủ cáp, tập điểm":state.maThueBao,"Tên khách hàng/Địa chỉ đài trạm/Tủ cáp, tập điểm":state.tenKH,"Tọa độ":state.toaDo,"Kết quả kiểm tra":state.ketQua,"Hình ảnh kiểm tra (theo quy định)":state.hinhAnhQuyDinh,"Lỗi tồn tại":state.loiTonTai,"Phân loại lỗi":state.phanLoaiLoi,"Nguyên nhân tồn tại (nếu có)":state.nguyenNhan,"Đánh giá":state.danhGia,"Đề xuất khắc phục":state.deXuat,"Bộ phận/Cá nhân chịu trách nhiệm khắc phục":state.boPhan,"Thời gian yêu cầu khắc phục":state.thoiGianKhacPhuc,"Hình ảnh 1":state.photos[0]||"","Hình ảnh 2":state.photos[1]||"","Hình ảnh 3":state.photos[2]||""};fetch(APPS_SCRIPT_URL,{method:"POST",body:JSON.stringify(payload)}).then(r=>r.text()).then(txt=>showDoneScreen(/^OK/i.test(txt.trim()),txt,/^DUPLICATE/i.test(txt.trim()))).catch(e=>showDoneScreen(false,e.message,false))}
function showDoneScreen(success,msg,isDup){const app=document.getElementById("app");let title,desc;if(success){title="Đã gửi thành công";desc="Dữ liệu và hình ảnh của mục <b>"+currentId()+"</b> đã được ghi vào Google Sheets."}else if(isDup){title="Mục này đã có người nhập";desc="Mục <b>"+currentId()+"</b> vừa được người khác nhập trước."}else{title="Gửi thất bại";desc="Có lỗi xảy ra: "+msg}app.innerHTML=`<div class="done-screen"><div class="done-badge">${success?"✓":"!"}</div><h2>${title}</h2><p>${desc}</p><button class="btn btn-next" style="max-width:220px" onclick="location.reload()">${success?"Nhập mục khác":"Thử lại"}</button></div>`}
renderStep();
</script>
</body>
</html>
